<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      Tab 2
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-list>
  <ion-item color="light" lines="full">
    <ion-grid>
      <ion-row>
        <ion-col><strong>Nombre</strong></ion-col>
        <ion-col><strong>Categoría</strong></ion-col>
        <ion-col><strong>Precio</strong></ion-col>
        <ion-col size="auto"><strong>Acciones</strong></ion-col>
      </ion-row>
    </ion-grid>
  </ion-item>

  @for(producto of productos; track producto) {
    <ion-item lines="full">
      <ion-grid>
        <ion-row class="ion-align-items-center">
            
            <ion-col>{{$any(producto).Nombre}}</ion-col>
            <ion-col>{{$any(producto).Categoria}}</ion-col>
            <ion-col>${{ $any(producto).Precio }}</ion-col>

          <ion-col size="auto">
            
            <ion-button fill="clear" color="primary" (click)="editar(producto)">
              <ion-icon slot="icon-only" name="create-outline"></ion-icon>
            </ion-button>

            <ion-button fill="clear" color="danger" (click)="borrar(producto)">
              <ion-icon slot="icon-only" name="trash-outline"></ion-icon>
            </ion-button>

          </ion-col>

        </ion-row>
      </ion-grid>
    </ion-item>
  } @empty {
    <ion-item lines="none">
      <ion-label class="ion-text-center">No hay datos.</ion-label>
    </ion-item>
  }
</ion-list>
</ion-content>
